<button
  type="button"
  class="date-picker__trigger"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
    <path d="M3.5 9.5h17" stroke-linecap="round" />
    <path d="M8 3v3.5M16 3v3.5" stroke-linecap="round" />
  </svg>
</button>

@if (open()) {
  <div class="date-picker__panel" role="dialog" [attr.aria-label]="label()">
    <div class="date-picker__header">
      <button type="button" class="date-picker__nav" [disabled]="!canGoPrevMonth()" (click)="prevMonth()" aria-label="Previous month">
        ‹
      </button>
      <span class="date-picker__month font-display">{{ monthLabel() }}</span>
      <button type="button" class="date-picker__nav" (click)="nextMonth()" aria-label="Next month">›</button>
    </div>

    <div class="date-picker__weekdays">
      @for (day of weekdayLabels; track day) {
        <span>{{ day }}</span>
      }
    </div>

    <div class="date-picker__grid">
      @for (week of weeks(); track $index) {
        @for (cell of week; track cell.date.getTime()) {
          <button
            type="button"
            class="date-picker__day"
            [class.is-outside]="!cell.inCurrentMonth"
            [class.is-today]="isToday(cell.date)"
            [disabled]="cell.disabled"
            (click)="selectDay(cell)"
          >
            {{ cell.date.getDate() }}
          </button>
        }
      }
    </div>
  </div>
}
