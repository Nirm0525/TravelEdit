<article class="experience-card">
  <div class="experience-card__frame">
    <img [src]="experience().image" [alt]="experience().alt" [title]="experience().alt" loading="lazy" decoding="async" [attr.title]="experience().alt" aria-label="experience().alt" />
  </div>
  <div class="experience-card__label">
    <span class="experience-card__icon" aria-hidden="true">
      <app-experience-icon [type]="experience().icon" />
    </span>
    <span class="experience-card__name font-display">{{ experience().name }}</span>
  </div>
</article>
