<section class="about" id="about" aria-labelledby="about-title">
  <div class="about__media">
    <img [src]="content().imageUrl" [alt]="content().imageAlt" loading="lazy" decoding="async" />
  </div>

  <div class="about__content">
    <div class="container about__inner">
      <p class="eyebrow">{{ content().eyebrow }}</p>
      <h2 id="about-title" class="about__title font-display" appRevealOnScroll>
        {{ content().titleLine1 }}<br />{{ content().titleLine2 }}
      </h2>

      <p class="about__text">{{ content().paragraph1 }}</p>
      <p class="about__text">{{ content().paragraph2 }}</p>
      <p class="about__text">{{ content().paragraph3 }}</p>

      <ul class="about__words">
        @for (word of content().words; track word; let i = $index) {
          <li [appRevealOnScroll]="i * 0.15">{{ word }}</li>
        }
      </ul>
    </div>
  </div>
</section>
