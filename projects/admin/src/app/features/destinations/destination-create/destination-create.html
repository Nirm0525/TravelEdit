<app-admin-page-header [breadcrumb]="[{ label: 'Panel', link: '/dashboard' }, { label: 'Destinos', link: '/destinos' }, { label: 'Nuevo destino' }]" title="Nuevo destino" />

<form class="destination-create" [formGroup]="form" (ngSubmit)="save()">
  <div class="destination-create__grid">
    <label class="field">
      <span>Título</span>
      <input type="text" formControlName="title" (input)="onTitleInput()" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <span class="field__hint field__hint--error">El título es obligatorio.</span>
      }
    </label>

    <label class="field">
      <span>Slug</span>
      <input type="text" formControlName="slug" />
      @if (form.controls.slug.touched && form.controls.slug.invalid) {
        <span class="field__hint field__hint--error">Solo minúsculas, números y guiones (ej: costa-amalfitana).</span>
      }
    </label>

    <label class="field">
      <span>País / región</span>
      <input type="text" formControlName="countryRegion" />
      @if (form.controls.countryRegion.touched && form.controls.countryRegion.invalid) {
        <span class="field__hint field__hint--error">El país/región es obligatorio.</span>
      }
    </label>

    <label class="field">
      <span>Tipo de viaje</span>
      <select formControlName="tripType">
        <option [ngValue]="null">Selecciona un tipo…</option>
        @for (option of tripTypeOptions; track option.value) {
          <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
      @if (form.controls.tripType.touched && form.controls.tripType.invalid) {
        <span class="field__hint field__hint--error">Selecciona un tipo de viaje.</span>
      }
    </label>

    <label class="field">
      <span>Duración (días)</span>
      <input type="number" formControlName="durationDays" min="1" />
    </label>

    <label class="field">
      <span>Temporada recomendada</span>
      <select formControlName="season">
        <option [ngValue]="null">— Sin especificar —</option>
        @for (option of seasonOptions; track option.value) {
          <option [ngValue]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Precio desde (USD)</span>
      <input type="number" formControlName="priceRangeMin" min="0" />
    </label>

    <label class="field">
      <span>Precio hasta (USD)</span>
      <input type="number" formControlName="priceRangeMax" min="0" />
    </label>
  </div>

  <label class="field">
    <span>Descripción corta (para tarjetas)</span>
    <textarea formControlName="shortDescription" rows="2" maxlength="200"></textarea>
    <span class="field__hint">{{ form.controls.shortDescription.value.length }}/200</span>
  </label>

  <p class="field__hint">El destino se crea como borrador — podrás agregar galería, itinerario y descripción larga antes de publicarlo.</p>

  @if (error()) {
    <p class="field__hint field__hint--error">{{ error() }}</p>
  }

  <div class="destination-create__footer">
    <a class="btn btn--secondary" routerLink="/destinos">Cancelar</a>
    <button type="submit" class="btn btn--primary" [disabled]="saving()">
      {{ saving() ? 'Creando…' : 'Crear destino' }}
    </button>
  </div>
</form>
