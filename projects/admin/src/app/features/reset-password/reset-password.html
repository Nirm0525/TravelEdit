<main class="login">
  <div class="login__bg" aria-hidden="true">
    <img src="images/login-visual.jpg" alt="" loading="eager" />
  </div>

  @if (done()) {
    <div class="login__card">
      <img src="images/logos/thetraveleditlogo1.png" alt="The Travel Edit" class="login__logo" />
      <h1 class="page-title">Contraseña actualizada</h1>
      <p>Ya puedes usar tu nueva contraseña. Entrando al panel…</p>
    </div>
  } @else {
    <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <img src="images/logos/thetraveleditlogo1.png" alt="The Travel Edit" class="login__logo" />
      <h1 class="page-title">Nueva contraseña</h1>

      <label class="login__field">
        <span>Nueva contraseña</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="login__hint" role="alert">Debe tener al menos 6 caracteres.</span>
        }
      </label>

      <label class="login__field">
        <span>Confirmar contraseña</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.controls.confirmPassword.touched && form.errors?.['mismatch']) {
          <span class="login__hint" role="alert">Las contraseñas no coinciden.</span>
        }
      </label>

      @if (errorMessage(); as message) {
        <p class="login__hint login__hint--form" role="alert">{{ message }}</p>
      }

      <button type="submit" class="login__submit btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Guardando…' : 'Guardar contraseña' }}
      </button>

      <a class="login__back" routerLink="/login">← Volver a iniciar sesión</a>
    </form>
  }
</main>
