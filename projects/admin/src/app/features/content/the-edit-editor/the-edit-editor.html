<form [formGroup]="form" (ngSubmit)="save()">
  <app-content-editor-layout
    [breadcrumb]="[{ label: 'Panel', link: '/dashboard' }, { label: 'Página principal', link: '/contenido' }, { label: 'The Edit' }]"
    title="The Edit"
    description="Encabezado de la sección. Los artículos se administran desde Blog."
    previewHref="/#the-edit"
    [loading]="loading()"
    [saving]="saving()"
    [saved]="!!savedAt()"
    [errorMessage]="error()"
  >
    <div class="content-section">
      <p class="content-section__title">Encabezado</p>

      <label class="field">
        <span>Eyebrow</span>
        <input type="text" formControlName="eyebrow" />
      </label>

      <div class="content-grid">
        <label class="field">
          <span>Título — línea 1</span>
          <input type="text" formControlName="headingLine1" />
        </label>
        <label class="field">
          <span>Título — línea 2</span>
          <input type="text" formControlName="headingLine2" />
        </label>
      </div>

      <div class="content-grid">
        <label class="field">
          <span>Texto de apoyo — línea 1</span>
          <input type="text" formControlName="supportLine1" />
        </label>
        <label class="field">
          <span>Texto de apoyo — línea 2</span>
          <input type="text" formControlName="supportLine2" />
        </label>
      </div>
    </div>

    <div class="content-section">
      <p class="content-section__title">Botón</p>
      <div class="content-grid">
        <label class="field">
          <span>Texto del botón</span>
          <input type="text" formControlName="ctaLabel" />
        </label>
        <label class="field">
          <span>Enlace</span>
          <input type="text" formControlName="ctaHref" />
        </label>
      </div>
    </div>

    <div class="content-section">
      <p class="content-section__title">Artículos</p>
      <p class="field__hint">
        Los artículos de esta sección ahora se crean y editan desde
        <a routerLink="/blog">Blog</a>. Se muestran automáticamente los últimos publicados.
      </p>
    </div>
  </app-content-editor-layout>
</form>
