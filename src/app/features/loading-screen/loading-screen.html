@if (visible()) {
  <div class="loading-screen" #overlay role="status" aria-label="Cargando The Travel Edit">
    <div class="loading-screen__mark">
      <div class="loading-screen__line" #line></div>
      <img #logo class="loading-screen__logo" src="images/logos/thetraveleditlogo1.png" alt="The Travel Edit" />
    </div>
    <p class="loading-screen__tagline" #tagline>The Journey Is Yours</p>
  </div>
}
