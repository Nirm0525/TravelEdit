<section class="the-edit" id="the-edit" aria-labelledby="the-edit-title">
  <div class="container the-edit__layout">
    <div class="the-edit__intro">
      <app-section-title eyebrow="The Edit" theme="dark">
        Stories worth<br />collecting.
        <p support>Inspiration. Curated.<br />For the curious soul.</p>
      </app-section-title>
      <app-animated-button href="#the-edit" theme="dark" variant="outline">EXPLORE THE EDIT</app-animated-button>
    </div>

    <div class="the-edit__articles">
      @for (article of articles; track article.title) {
        <app-article-card [article]="article" />
      }
    </div>
  </div>
</section>
