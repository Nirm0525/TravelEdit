@if (documents().length > 0) {
  <div class="proposal-docs no-print">
    <p class="proposal-docs__title">Documentos</p>
    <ul class="proposal-docs__list">
      @for (doc of documents(); track doc.id) {
        <li class="proposal-docs__item">
          <span class="proposal-docs__icon" aria-hidden="true">
            @if (isImage(doc)) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="4.5" width="17" height="15" rx="2" />
                <circle cx="9" cy="10" r="1.6" />
                <path d="M4 17l5-4.5 3.5 3L15.5 13 20 17" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 3.5h7l4.5 4.5v11a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5Z" />
                <path d="M14 3.5V8h4.5" />
                <path d="M8.5 13h7M8.5 16.5h5" />
              </svg>
            }
          </span>
          <span class="proposal-docs__text">
            <span class="proposal-docs__name">{{ displayName(doc.name) }}</span>
            <span class="proposal-docs__kind">{{ kindLabel(doc) }}</span>
          </span>
          <button
            type="button"
            class="proposal-docs__link"
            [disabled]="busyId() === doc.id"
            (click)="openDocument.emit(doc)"
          >
            {{ busyId() === doc.id ? 'Abriendo…' : 'Ver documento →' }}
          </button>
        </li>
      }
    </ul>
  </div>
}
