<figure class="destination-card">
  <div class="destination-card__frame" data-cursor="view">
    <div class="destination-card__ambient" [style.animation-delay.s]="index() * -3.7">
      <img
        [src]="destination().image"
        [alt]="destination().alt"
        title="Destination"
        [attr.title]="destination().alt"
        loading="lazy"
        decoding="async"
        draggable="false"
      />
    </div>
    <div class="destination-card__overlay" aria-hidden="true">
      <span>EXPLORE</span>
    </div>
  </div>
  <figcaption class="destination-card__caption">
    <span class="destination-card__name">{{ destination().name }} <span aria-hidden="true">→</span></span>
    <span class="destination-card__country">{{ destination().country }}</span>
  </figcaption>
</figure>
