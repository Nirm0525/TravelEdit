<div class="rich-text-editor" [class.rich-text-editor--disabled]="disabled()" [class.rich-text-editor--fullscreen]="fullscreen()" #root>
  <div class="rich-text-editor__toolbar rich-text-editor__toolbar--main" role="toolbar" aria-label="Formato de texto">
    <select class="rich-text-editor__select" aria-label="Estilo de bloque" [value]="active().headingLevel ?? 'p'" (change)="setBlockType($any($event.target).value)">
      <option value="p">Párrafo</option>
      <option value="1">Título 1</option>
      <option value="2">Título 2</option>
      <option value="3">Título 3</option>
      <option value="4">Título 4</option>
    </select>

    <span class="rich-text-editor__divider"></span>

    <button type="button" [class.is-active]="active().bold" (click)="toggleBold()" aria-label="Negrita" title="Negrita">
      <strong>B</strong>
    </button>
    <button type="button" [class.is-active]="active().italic" (click)="toggleItalic()" aria-label="Cursiva" title="Cursiva">
      <em>I</em>
    </button>
    <button type="button" [class.is-active]="active().underline" (click)="toggleUnderline()" aria-label="Subrayado" title="Subrayado">
      <span class="rich-text-editor__underline-label">U</span>
    </button>
    <button type="button" [class.is-active]="active().strike" (click)="toggleStrike()" aria-label="Tachado" title="Tachado">
      <span class="rich-text-editor__strike-label">S</span>
    </button>

    <span class="rich-text-editor__divider"></span>

    <div class="rich-text-editor__dropdown" data-dropdown="color">
      <button type="button" class="rich-text-editor__swatch-btn" (click)="toggleColorMenu()" aria-label="Color de texto" title="Color de texto">
        <span>A</span>
        <i [style.background]="active().textColor ?? '#16110F'"></i>
      </button>
      @if (colorMenuOpen()) {
        <div class="rich-text-editor__menu">
          <button type="button" class="rich-text-editor__menu-reset" (click)="setTextColor(null)">Quitar color</button>
          <div class="rich-text-editor__swatch-grid">
            @for (color of textColors; track color.value) {
              <button
                type="button"
                class="rich-text-editor__swatch"
                [class.is-active]="active().textColor === color.value"
                [style.background]="color.value"
                attr.aria-label="{{ color.label }}"
                title="{{ color.label }}"
                (click)="setTextColor(color.value)"
              ></button>
            }
          </div>
        </div>
      }
    </div>

    <div class="rich-text-editor__dropdown" data-dropdown="highlight">
      <button type="button" class="rich-text-editor__swatch-btn" (click)="toggleHighlightMenu()" aria-label="Resaltado" title="Resaltado">
        <span>A</span>
        <i [style.background]="active().highlightColor ?? '#F6EFE6'"></i>
      </button>
      @if (highlightMenuOpen()) {
        <div class="rich-text-editor__menu">
          <button type="button" class="rich-text-editor__menu-reset" (click)="setHighlightColor(null)">Quitar resaltado</button>
          <div class="rich-text-editor__swatch-grid">
            @for (color of highlightColors; track color.value) {
              <button
                type="button"
                class="rich-text-editor__swatch"
                [class.is-active]="active().highlightColor === color.value"
                [style.background]="color.value"
                attr.aria-label="{{ color.label }}"
                title="{{ color.label }}"
                (click)="setHighlightColor(color.value)"
              ></button>
            }
          </div>
        </div>
      }
    </div>

    <span class="rich-text-editor__divider"></span>

    <button type="button" [class.is-active]="active().align === 'left'" (click)="setAlign('left')" aria-label="Alinear a la izquierda" title="Alinear a la izquierda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16M4 12h10M4 18h13" stroke-linecap="round" /></svg>
    </button>
    <button type="button" [class.is-active]="active().align === 'center'" (click)="setAlign('center')" aria-label="Centrar" title="Centrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16M7 12h10M5.5 18h13" stroke-linecap="round" /></svg>
    </button>
    <button type="button" [class.is-active]="active().align === 'right'" (click)="setAlign('right')" aria-label="Alinear a la derecha" title="Alinear a la derecha">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16M10 12h10M7 18h13" stroke-linecap="round" /></svg>
    </button>
    <button type="button" [class.is-active]="active().align === 'justify'" (click)="setAlign('justify')" aria-label="Justificar" title="Justificar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" /></svg>
    </button>

    <span class="rich-text-editor__divider"></span>

    <button type="button" [class.is-active]="active().bulletList" (click)="toggleBulletList()" aria-label="Lista con viñetas" title="Lista con viñetas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none" /><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none" /><path d="M9 6h11M9 12h11M9 18h11" stroke-linecap="round" /></svg>
    </button>
    <button type="button" [class.is-active]="active().orderedList" (click)="toggleOrderedList()" aria-label="Lista numerada" title="Lista numerada">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6h11M9 12h11M9 18h11" stroke-linecap="round" /><text x="1.5" y="8" font-size="6" fill="currentColor" stroke="none">1</text><text x="1.5" y="14" font-size="6" fill="currentColor" stroke="none">2</text><text x="1.5" y="20" font-size="6" fill="currentColor" stroke="none">3</text></svg>
    </button>
    <button type="button" [class.is-active]="active().taskList" (click)="toggleTaskList()" aria-label="Lista de tareas" title="Lista de tareas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3.5" y="4.5" width="5" height="5" rx="1" /><path d="M4.7 7l0.9 0.9L8 6" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 7h9M3.5 14.5h5M12 14.5h9M3.5 19.5h5M12 19.5h9" stroke-linecap="round" /></svg>
    </button>

    <span class="rich-text-editor__divider"></span>

    <button type="button" [class.is-active]="active().blockquote" (click)="toggleBlockquote()" aria-label="Cita" title="Cita">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 6c-2.2 0-4 1.8-4 4 0 2 1.5 3.6 3.4 3.9C6 15.6 4.9 17 3 17v2c3.3 0 5.5-2.4 5.9-5.6.2-1.4 0-2.7-.5-3.7C7.9 8.4 6.7 8 6 8c-.2 0-.4 0-.6.1C5.7 7.1 6.4 6.4 7.5 6.1L7 6zm10 0c-2.2 0-4 1.8-4 4 0 2 1.5 3.6 3.4 3.9-.4 1.7-1.5 3.1-3.4 3.1v2c3.3 0 5.5-2.4 5.9-5.6.2-1.4 0-2.7-.5-3.7C17.9 8.4 16.7 8 16 8c-.2 0-.4 0-.6.1.3-1 1-1.7 2.1-2l-.5-.1z" /></svg>
    </button>
    <button type="button" [class.is-active]="active().code" (click)="toggleCode()" aria-label="Código" title="Código">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 8 5 12l4 4M15 8l4 4-4 4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <button type="button" [class.is-active]="active().link" (click)="setLink()" aria-label="Enlace" title="Enlace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 14a4 4 0 0 0 5.7.4l2-2A4 4 0 1 0 12 6.7l-.7.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 10a4 4 0 0 0-5.7-.4l-2 2A4 4 0 1 0 12 17.3l.7-.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <button type="button" (click)="triggerImageUpload(imageFileInput)" [disabled]="uploadingImage()" aria-label="Imagen" title="Imagen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" /><circle cx="8.5" cy="9.5" r="1.5" /><path d="m4 17 5-5 3.5 3.5L16 12l4 4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <input
      #imageFileInput
      type="file"
      accept="image/*"
      class="rich-text-editor__hidden-input"
      aria-label="Seleccionar imagen"
      title="Seleccionar imagen"
      (change)="onImageFileSelected($event)"
    />
    <button type="button" (click)="insertTable()" aria-label="Tabla" title="Tabla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3.5" y="4.5" width="17" height="15" rx="1" /><path d="M3.5 10h17M3.5 15h17M9.5 4.5v15M15 4.5v15" /></svg>
    </button>
  </div>

  <div class="rich-text-editor__toolbar rich-text-editor__toolbar--secondary" role="toolbar" aria-label="Formato adicional">
    <select class="rich-text-editor__select" aria-label="Fuente" [value]="active().fontFamily ?? ''" (change)="setFontFamily($any($event.target).value)">
      @for (font of fonts; track font.label) {
        <option [value]="font.value ?? ''">{{ font.label }}</option>
      }
    </select>
    <select class="rich-text-editor__select" aria-label="Tamaño de fuente" [value]="active().fontSize ?? ''" (change)="setFontSize($any($event.target).value)">
      @for (size of fontSizes; track size.label) {
        <option [value]="size.value ?? ''">{{ size.label }}</option>
      }
    </select>

    <span class="rich-text-editor__divider"></span>

    <button type="button" (click)="insertHorizontalRule()" aria-label="Línea divisoria" title="Línea divisoria">—</button>
    <button type="button" (click)="clearFormatting()" aria-label="Limpiar formato" title="Limpiar formato">
      <span class="rich-text-editor__clear-label">Tx</span>
    </button>
    <button type="button" [class.is-active]="htmlSourceMode()" (click)="toggleHtmlSource()" aria-label="Ver HTML" title="Ver HTML">
      &lt;/&gt;
    </button>
    <button type="button" [class.is-active]="fullscreen()" (click)="toggleFullscreen()" aria-label="Pantalla completa" title="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
  </div>

  @if (htmlSourceMode()) {
    <textarea
      class="rich-text-editor__source"
      spellcheck="false"
      aria-label="Código HTML del artículo"
      placeholder="HTML del contenido"
      [value]="htmlSourceValue()"
      (input)="onHtmlSourceInput($any($event.target).value)"
    ></textarea>
  } @else {
    <div class="rich-text-editor__surface" #editorHost></div>
  }
</div>
