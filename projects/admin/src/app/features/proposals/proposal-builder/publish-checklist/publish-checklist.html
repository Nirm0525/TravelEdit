@if (problems().length > 0) {
  <section id="publish-checklist" class="publish-checklist" tabindex="-1" aria-labelledby="publish-checklist-title" aria-live="polite">
    <h2 id="publish-checklist-title" class="publish-checklist__title">{{ title() }}</h2>
    <ul class="publish-checklist__list">
      @for (problem of problems(); track trackKey(problem)) {
        <li>
          <button type="button" class="publish-checklist__item" (click)="selected.emit(problem)">
            <span class="publish-checklist__message">{{ problem.message }}</span>
            <span class="publish-checklist__go" aria-hidden="true">Ir →</span>
          </button>
        </li>
      }
    </ul>
  </section>
}
