@if (mobileOpen()) {
  <div class="admin-sidebar__overlay" (click)="closeMobile()" aria-hidden="true"></div>
}

<aside class="admin-sidebar" [class.is-collapsed]="collapsed()" [class.is-mobile-open]="mobileOpen()">
  <div class="admin-sidebar__brand">
    <img src="logo.png" alt="The Travel Edit" class="admin-sidebar__logo" />
    @if (!collapsed()) {
      <span class="admin-sidebar__brand-label">Panel</span>
    }
  </div>

  <nav class="admin-sidebar__nav" aria-label="Secciones del panel">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="is-active"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="admin-sidebar__link"
        [attr.data-tooltip]="collapsed() ? item.label : null"
        [attr.aria-label]="collapsed() ? item.label : null"
        (click)="closeMobile()"
      >
        <span class="admin-sidebar__icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('dashboard') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
            }
            @case ('home') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 11.5 12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('compass') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="9" />
                <path d="M15 9l-3.5 6.5L8 12l3.5-6.5L15 9z" stroke-linejoin="round" />
              </svg>
            }
            @case ('inbox') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 12h5l1.5 3h5L16 12h5" stroke-linecap="round" stroke-linejoin="round" />
                <rect x="3" y="5" width="18" height="14" rx="2" stroke-linejoin="round" />
              </svg>
            }
            @case ('users') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="9" cy="8" r="3" />
                <path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M16 8.5a2.5 2.5 0 1 0 0-5" stroke-linecap="round" />
                <path d="M18 14.6c2 .5 3.3 2.2 3.3 4.9" stroke-linecap="round" />
              </svg>
            }
          }
        </span>
        @if (!collapsed()) {
          <span class="admin-sidebar__label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <button
    type="button"
    class="admin-sidebar__collapse-toggle"
    (click)="toggleCollapsed()"
    [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
  >
    <svg
      class="admin-sidebar__collapse-icon"
      [class.admin-sidebar__collapse-icon--flipped]="collapsed()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @if (!collapsed()) {
      <span>Contraer</span>
    }
  </button>
</aside>
