<main class="login">
  <div class="login__bg" aria-hidden="true">
    <img src="images/login-visual.jpg" alt="" loading="eager" />
  </div>

  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <img src="images/logos/thetraveleditlogo1.png" alt="The Travel Edit" class="login__logo" />
    <h1 class="page-title">Panel administrativo</h1>

    <label class="login__field">
      <span>Correo</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="login__hint" role="alert">Ingresa un correo válido.</span>
      }
    </label>

    <label class="login__field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="login__hint" role="alert">La contraseña es obligatoria.</span>
      }
    </label>

    <a class="login__back" routerLink="/recuperar-contrasena">¿Olvidaste tu contraseña?</a>

    @if (errorMessage(); as message) {
      <p class="login__hint login__hint--form" role="alert">{{ message }}</p>
    }

    <button type="submit" class="login__submit btn btn--primary" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>

    <a class="login__back" href="/">← Volver a la web</a>
  </form>
</main>
