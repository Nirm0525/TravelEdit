<app-admin-page-header [breadcrumb]="breadcrumb" title="Página principal">
  <button type="button" class="btn btn--primary" (click)="openPreview(homePreviewHref)">Vista previa</button>
</app-admin-page-header>

<app-preview-modal [url]="previewUrl()" (closed)="closePreview()" />

<p class="content-overview__intro">Administra el contenido que aparece en Travel Edit.</p>

@if (error(); as message) {
  <div class="content-overview__error">
    <p>{{ message }}</p>
    <button type="button" class="btn btn--secondary" (click)="load()">Reintentar</button>
  </div>
}

<div class="content-overview__grid">
  @for (section of sections; track section.sectionKey) {
    <app-content-section-card
      [name]="section.name"
      [description]="section.description"
      [editLink]="section.editLink"
      [previewHref]="section.previewHref"
      [loading]="loading()"
      [updatedAt]="updatedAtBySection()[section.sectionKey] ?? null"
      (previewRequested)="openPreview($event)"
    />
  }

  @for (section of customSections(); track section.id) {
    <app-content-section-card
      [name]="section.title || 'Sección sin título'"
      description="Sección personalizada."
      [editLink]="'/contenido/personalizada/' + section.id"
      [previewHref]="'/#custom-' + section.id"
      [loading]="loading()"
      [updatedAt]="updatedAtBySection()['custom_sections'] ?? null"
      (previewRequested)="openPreview($event)"
    />
  }

  <button type="button" class="content-overview__add" [disabled]="creating()" (click)="createSection()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke-linecap="round" />
    </svg>
    {{ creating() ? 'Creando…' : 'Nueva sección' }}
  </button>
</div>
