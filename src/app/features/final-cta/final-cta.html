<section class="final-cta" id="final-cta" aria-labelledby="final-cta-title">
  <div class="final-cta__bg">
    <img [src]="content().imageUrl" [alt]="content().imageAlt" loading="lazy" decoding="async" />
  </div>

  <div class="container final-cta__content" appRevealOnScroll>
    <p class="eyebrow eyebrow--on-dark">{{ content().eyebrow }}</p>
    <h2 id="final-cta-title" class="final-cta__title font-display">{{ content().titleLine1 }}<br />{{ content().titleLine2 }}</h2>
    <p class="final-cta__text">{{ content().text }}</p>

    <app-animated-button theme="dark" (buttonClick)="openTravelEditForm()">{{ content().ctaLabel }}</app-animated-button>

    <div class="final-cta__links">
      @for (link of content().links; track link.label) {
        <a [href]="link.href" data-cursor="explore">{{ link.label }}</a>
      }
    </div>
  </div>
</section>
