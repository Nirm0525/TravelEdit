<section class="the-edit" id="the-edit" aria-labelledby="the-edit-title">
  <div class="the-edit__bg">
    <img src="/images/The%20Travel%20Edit-43.jpg" alt="" loading="lazy" decoding="async" />
    <div class="the-edit__overlay" aria-hidden="true"></div>
    <div class="the-edit__glow the-edit__glow--beige" aria-hidden="true"></div>
    <div class="the-edit__glow the-edit__glow--wine" aria-hidden="true"></div>
  </div>

  <div class="container the-edit__layout">
    <div class="the-edit__intro">
      <app-section-title [eyebrow]="heading().eyebrow" theme="dark">
        {{ heading().headingLine1 }}<br />{{ heading().headingLine2 }}
        <p support>{{ heading().supportLine1 }}<br />{{ heading().supportLine2 }}</p>
      </app-section-title>
      <app-animated-button [href]="heading().ctaHref" theme="dark" variant="outline">{{ heading().ctaLabel }}</app-animated-button>
    </div>

    <div class="the-edit__articles">
      @for (article of articles(); track article.title) {
        <app-article-card [article]="article" />
      }
    </div>
  </div>
</section>
